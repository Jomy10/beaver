on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual rerun"

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
       ruby:
        - version: "3.2.11"
        - version: "3.3.12"
        - version: "3.4.10"
        - version: "4.0.7"
        - version: "4.0.7"
          mode: "static"
       platform:
         - os: linux
           arch: x86_64
           target: x86_64-unknown-linux-gnu
           runner: ubuntu
           build_ruby: true
         # - os: linux
         #   arch: arm64
         #   target: arm64-unknown-linux-gnu
         #   runner: ubuntu-arm
         #   build_ruby: true
    name: build-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.ruby.version }}${{ matrix.ruby.mode == 'static' && '-static' || '' }}
    runs-on: ${{ matrix.platform.runner }}
    env:
      RUBY_BASE_PATH: /opt/rubies
      RUBY_PATH: /opt/rubies/ruby-${{ matrix.ruby.version }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ (forgejo.event_name == 'release' && forgejo.event.release.tag_name) || '' }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y clang libclang-dev wget libgmp3-dev libyaml-dev

      - name: Install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly

      - name: Create ruby path
        run: |
          # Create path to rubies
          [ -d "$RUBY_BASE_PATH" ] || mkdir -p "$RUBY_BASE_PATH"

      - name: Cache ruby installation
        uses: actions/cache@v4
        with:
          path: "$RUBY_BASE_PATH"
          key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-ruby-install-${{ matrix.ruby.version }}-${{ matrix.ruby.mode || 'dyn' }}
          restore-key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-ruby-install-

      - name: Setup ruiby
        run: |
          set -xe

          if [ -x "$RUBY_PATH/bin/ruby" ]; then
            echo "Ruby already installed at $RUBY_PATH, skipping build"
            exit 0
          fi

          # Install ruby-install
          wget https://github.com/postmodern/ruby-install/releases/download/v0.10.2/ruby-install-0.10.2.tar.gz
          tar -xzvf ruby-install-0.10.2.tar.gz
          cd ruby-install-0.10.2/
          make install

          echo "version: ${{ matrix.ruby.version }}"
          echo "static: ${{ matrix.ruby.mode }}"
          echo "build ruby: ${{ matrix.platform.build_ruby }}"

          if [ "${{ matrix.ruby.mode }}" == "static" ]; then
            export RUBY_CONFIGURE_OPTS="--enable-static"
          fi
          ruby-install ruby ${{ matrix.ruby.version }} \
            -j $(nproc) \
            --rubies-dir /opt/rubies \
            --install-dir $RUBY_PATH \
            -- \
              --disable-install-doc

      - name: List versions
        run: |
          . "$HOME/.cargo/env"
          cargo --version
          $RUBY_PATH/bin/ruby --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-cargo-${{ hashfiles('**/Cargo.lock') }}
          restore-key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-cargo-

      - name: Build Beaver
        run: |
          . "$HOME/.cargo/env"
          if [ "${{ matrix.ruby.mode }}" == "static" ]; then
            export CARGO_FLAGS="$CARGO_FLAGS --features static-ruby"
          fi
          RUBY=$RUBY_PATH/bin/ruby cargo build --release --locked

      - name: Upload executable to release
        if: forgejo.event_name == 'release'
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          REPOSITORY: ${{ forgejo.repository }}
          TAG: ${{ forgejo.event.release.tag_name }}
          API_URL: ${{ forgejo.api_url }}
        run: |
          set -eu

          ASSET="target/release/beaver"

          RELEASE_ID=$(curl -fsSL \
            -H "Authorization: token $TOKEN" \
            "$API_URL/repos/$REPOSITORY/releases/tags/$TAG" | jq -r .id)

          NAME="beaver$RELEASE_ID-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-ruby-${{ matrix.ruby.version }}"
          if [ ${{ matrix.ruby.mode }} == "static" ]; then
            NAME += "-static"
          fi
          ARCHIVE="$NAME.tar.gz"

          tar -czf "$ARCHIVE" "$(basename "$ASSET")"

          curl -fsSL \
            -X POST \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$ARCHIVE" \
            "$API_URL/repos/$REPOSITORY/releases/$RELEASE_ID/assets"

      - name: Upload executable to action
        if: forgejo.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v3
        with:
          name: executable
          path: target/release/beaver
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - version: "3.2.11"
          - version: "3.3.12"
          - version: "3.4.10"
          - version: "4.0.7"
          - version: "4.0.7"
            mode: "static"
        platform:
          - os: macos
            arch: arm64
            runner: macos-arm
    name: build-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.ruby.version }}${{ matrix.ruby.mode == 'static' && '-static' || '' }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ (forgejo.event_name == 'release' && forgejo.event.release.tag_name) || '' }}

      - name: Set ruby paths
        run: |
          echo "RUBY_BASE_PATH`$HOME/.rubies" >> "$GITHUB_ENV"
          echo "RUBY_PATH: $HOME/.rubies/ruby-${{ matrix.ruby.version }}" >> "$GITHUB_ENV"

      - name: Install ruby-build
        run: |
            brew install -y ruby-build

      - name: Create ruby path
        run: |
            [ -d "$RUBY_BASE_PATH" ] || mkdir -p "$RUBY_BASE_PATH"

      - name: Install ruby
        run: |
            if [ -x "$RUBY_PATH/bin/ruby" ]; then
              echo "Ruby already installed at $RUBY_PATH, skipping build"
              exit 0
            fi

            if [ "${{ matrix.ruby.mode }}" == "static" ]; then
              ruby-build ruby-${{ matrix.ruby.version }} "$RUBY_PATH" -- --enable-static
            else
              ruby-build ruby-${{ matrix.ruby.version }} "$RUBY_PATH"
            fi

      - name: Install rust
        run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly

      - name: List versions
        run: |
          . "$HOME/.cargo/env"
          cargo --version
          "$RUBY_PATH/bin/ruby" --version

      - name: Build beaver
        run: |
            . "$HOME/cargo/env"
            if [ "${{ matrix.ruby.mode }}" == "static" ]; then
              export CARGO_FLAGS="$CARGO_FLAGS --features static-ruby"
            fi
            RUBY="$RUBY_PATH/bin/ruby" cargo build --release --locked

      - name: Upload executable to release
        if: forgejo.event_name == 'release'
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          REPOSITORY: ${{ forgejo.repository }}
          TAG: ${{ forgejo.event.release.tag_name }}
          API_URL: ${{ forgejo.api_url }}
        run: |
          set -eu

          ASSET="target/release/beaver"

          RELEASE_ID=$(curl -fsSL \
            -H "Authorization: token $TOKEN" \
            "$API_URL/repos/$REPOSITORY/releases/tags/$TAG" | jq -r .id)

          NAME="beaver$RELEASE_ID-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-ruby-${{ matrix.ruby.version }}"
          if [ ${{ matrix.ruby.mode }} == "static" ]; then
            NAME += "-static"
          fi
          ARCHIVE="$NAME.tar.gz"

          tar -czf "$ARCHIVE" "$(basename "$ASSET")"

          curl -fsSL \
            -X POST \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$ARCHIVE" \
            "$API_URL/repos/$REPOSITORY/releases/$RELEASE_ID/assets"

      - name: Upload executable to action
        if: forgejo.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v3
        with:
          name: beaver.zip
          path: target/release/beaver
          if-no-files-found: error
